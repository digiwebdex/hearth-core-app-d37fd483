name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "pm2 (default VPS) or docker"
        required: false
        default: "pm2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || secrets.VPS_DEPLOY_MODE || 'pm2' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
          VPS_PM2_NAME: ${{ secrets.VPS_PM2_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_DEPLOY_MODE,VPS_APP_DIR,VPS_PROJECT_DIR,VPS_PM2_NAME
          script: |
            set -euo pipefail
            DEPLOY_MODE="${VPS_DEPLOY_MODE:-pm2}"
            APP_DIR="${VPS_APP_DIR:-/var/www/hearth-core-app}"
            PROJECT_DIR="${VPS_PROJECT_DIR:-/opt/projects/hearth-core}"

            if [ "$DEPLOY_MODE" = "docker" ]; then
              if [ ! -x "$PROJECT_DIR/scripts/deploy.sh" ]; then
                echo "❌ Docker deploy script missing: $PROJECT_DIR/scripts/deploy.sh"
                exit 1
              fi
              echo "🐳 Docker deploy → $PROJECT_DIR"
              bash "$PROJECT_DIR/scripts/deploy.sh"
              exit 0
            fi

            DEPLOY_SCRIPT="$APP_DIR/scripts/vps-pm2-deploy.sh"
            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              echo "❌ PM2 deploy script missing: $DEPLOY_SCRIPT"
              echo "   Clone/pull repo to $APP_DIR first."
              exit 1
            fi
            chmod +x "$DEPLOY_SCRIPT"
            export APP_DIR="${VPS_APP_DIR:-/var/www/hearth-core-app}"
            export PM2_NAME="${VPS_PM2_NAME:-hearth-api}"
            echo "🚀 PM2 deploy → $APP_DIR (process: $PM2_NAME)"
            bash "$DEPLOY_SCRIPT"
